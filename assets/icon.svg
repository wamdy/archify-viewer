<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b7cff"/>
      <stop offset="0.55" stop-color="#4a9ce0"/>
      <stop offset="1" stop-color="#34c9a3"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="72" y="72" width="880" height="880" rx="208" fill="#151a24"/>
    <rect x="112" y="112" width="800" height="800" rx="176" fill="url(#tile)"/>
    <rect x="112" y="112" width="800" height="800" rx="176" fill="url(#sheen)"/>
    <rect x="116" y="116" width="792" height="792" rx="172" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="8"/>
  </g>

  <!-- 树状图：一张根、两张分支，对应 archify 的架构图/家谱产物库 -->
  <path d="M512 716 V456 M512 556 H316 V392 M512 556 H708 V392"
        fill="none" stroke="#ffffff" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="512" cy="732" r="76" fill="#ffffff"/>
  <circle cx="316" cy="364" r="76" fill="#ffffff"/>
  <circle cx="708" cy="364" r="76" fill="#ffffff"/>
</svg>
